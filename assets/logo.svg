<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-label="apeSteel mark">
  <g fill="#101820">
    <!-- Ape head + torso, sitting on the I-beam -->
    <path d="M 88 18
             Q 88 4, 120 4
             Q 152 4, 152 18
             L 152 30
             Q 158 32, 158 42
             Q 158 56, 152 60
             L 152 64
             Q 162 68, 168 78
             L 72 78
             Q 78 68, 88 64
             L 88 60
             Q 82 56, 82 42
             Q 82 32, 88 30
             Z"/>
    <!-- Ears -->
    <ellipse cx="80" cy="40" rx="6" ry="8"/>
    <ellipse cx="160" cy="40" rx="6" ry="8"/>
    <!-- Long ape arms hanging from the shoulders, wrapping the beam -->
    <path d="M 68 78
             Q 56 90, 56 110
             Q 56 130, 64 140
             L 78 140
             Q 72 130, 72 110
             Q 72 92, 80 82
             Z"/>
    <path d="M 172 78
             Q 184 90, 184 110
             Q 184 130, 176 140
             L 162 140
             Q 168 130, 168 110
             Q 168 92, 160 82
             Z"/>
    <!-- I-beam top flange -->
    <rect x="44" y="78" width="152" height="22"/>
    <!-- I-beam web -->
    <rect x="108" y="100" width="24" height="100"/>
    <!-- I-beam bottom flange -->
    <rect x="44" y="200" width="152" height="22"/>
  </g>
  <!-- Face features cut from background (paper) -->
  <g fill="#f4f0e6">
    <!-- Brow ridge line -->
    <rect x="100" y="26" width="40" height="3"/>
    <!-- Eyes -->
    <circle cx="108" cy="38" r="3.5"/>
    <circle cx="132" cy="38" r="3.5"/>
    <!-- Muzzle / mouth area -->
    <ellipse cx="120" cy="54" rx="14" ry="5"/>
  </g>
</svg>
