# Pre-commit hooks for apeSteel.
#
#   pip install -e ".[dev]"
#   pre-commit install
#
# Mirrors the CI quality gate (ruff lint + ruff format + pyright).  The
# full pytest suite is intentionally left to CI; pre-commit stays fast.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
